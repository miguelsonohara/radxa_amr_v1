ekf_filter_node:
  ros__parameters:
    # Set frequency to 20.0Hz to match ESP32-S3 micro-ROS state machine execution rate (20Hz / 50ms period)
    frequency: 20.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # --------------------------------------------------------------------------
    # 1. Raw Wheel Odometry from ESP32 (/odom)
    # --------------------------------------------------------------------------
    odom0: /odom
    odom0_config: [true,  true,  false,   # x, y, z position
                   false, false, false,   # roll, pitch, yaw orientation (Handled by IMU relative yaw)
                   true,  false, false,   # vx (true), vy (false - non-holonomic), vz (false)
                   false, false, false,   # vroll, vpitch, vyaw angular velocity (Handled by IMU Z-gyro)
                   false, false, false]   # ax, ay, az acceleration
    odom0_differential: false
    odom0_queue_size: 10

    # --------------------------------------------------------------------------
    # 2. MPU9250 IMU Data from ESP32 (/imu)
    # --------------------------------------------------------------------------
    imu0: /imu
    imu0_config: [false, false, false,   # x, y, z position
                  false, false, true,    # roll, pitch, yaw orientation (Fused in relative mode)
                  false, false, false,   # vx, vy, vz linear velocity
                  false, false, true,    # vroll, vpitch, vyaw angular velocity (Z gyro)
                  false, false, false]   # ax, ay, az linear acceleration (DISABLED to prevent position drift)
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
